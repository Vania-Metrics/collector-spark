# spark — and an exception worth the comment.
#
# "depend: [spark]" would be a mistake here. Since 1.21, Paper embeds spark in
# the server instead of loading it as a plugin: it doesn't show up in any
# list, so Bukkit would refuse to load this jar precisely where spark is
# present by default. The entry class checks for the API's presence instead.
#
# "softdepend: [spark]" is right, though: where spark is a plugin (Spigot,
# CraftBukkit), it loads first and Bukkit lets this jar use its classes without
# a warning. Where it is not (Paper, Purpur), a softdepend asks for nothing.
name: VaniaMetrics-Spark
version: ${version}
main: fr.samflix.vaniametrics.module.spark.SparkPaper
api-version: '1.21'
authors: [mc-vania]
description: "Spark metrics: tick duration, CPU, garbage collection."
depend: [VaniaMetrics]
softdepend: [spark]
folia-supported: true
