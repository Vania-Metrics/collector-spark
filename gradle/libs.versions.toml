# Compile-time dependencies only — no third-party jar is bundled in the
# produced jar. The VaniaMetrics API is not here: it comes from the core git
# repo (see gradle.properties and settings.gradle.kts).
#
# Third-party plugins come from Modrinth's Maven repo, at the exact version
# id: it's the same file, byte for byte, as the download link.
#
# The SHA-256 fingerprints of everything resolved are pinned in
# gradle/verification-metadata.xml. After a version bump:
#   ./gradlew --write-verification-metadata sha256 build
#
# paper-api is a dated snapshot: Paper doesn't publish a pinned version of its
# API, the timestamp is the version. It's read as a pinned version (see
# settings.gradle.kts), so without its transitive dependencies: the "paper"
# bundle declares the ones compilation needs, at the versions from paper-api's
# .pom. spark is compiled against the older of the two Paper versions running
# on this network — the one Paper embeds dates from 2024, the proxy's from
# 2026. Compiling against the newer one would produce a jar that fails on the
# lobby with a NoClassDefFoundError, which is exactly what happened. The two
# methods only the newer API has are called via reflection, and published
# only where they exist. spark-api is also a dated snapshot: the timestamp is
# the version.
[versions]
paper-api = "1.21.11-R0.1-20260511.115010-91"
adventure = "4.26.1"
velocity-api = "3.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
examination-api = { module = "net.kyori:examination-api", version = "1.3.0" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }
checker-qual = { module = "org.checkerframework:checker-qual", version = "3.49.2" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "24.1.0" }
guava = { module = "com.google.guava:guava", version = "33.3.1-jre" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
spark-api = { module = "me.lucko:spark-api", version = "0.1-20240720.200737-2" }

[bundles]
paper = ["paper-api", "adventure-api", "adventure-key", "examination-api", "jspecify", "checker-qual", "jetbrains-annotations", "guava"]
