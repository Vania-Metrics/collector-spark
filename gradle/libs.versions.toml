# Dépendances de COMPILATION seulement — aucun jar tiers n'est embarqué dans le
# jar produit. L'API VaniaMetrics n'est pas ici : elle vient du dépôt git core
# (voir gradle.properties et settings.gradle.kts).
#
# Les plugins tiers viennent du dépôt Maven de Modrinth, à l'id de version exact :
# c'est le même fichier, octet pour octet, que le lien de téléchargement.
#
# Les empreintes SHA-256 de tout ce qui est résolu sont épinglées dans
# gradle/verification-metadata.xml. Après une montée de version :
#   ./gradlew --write-verification-metadata sha256 build
#
# paper-api EST UN INSTANTANÉ DATÉ : Paper ne publie pas de version figée de son
# API, l'horodatage est la version. Il est lu comme une version figée (voir
# settings.gradle.kts), donc SANS ses dépendances transitives : le bundle « paper »
# déclare celles dont la compilation a besoin, aux versions du .pom de paper-api.
# SPARK EST COMPILÉ CONTRE LA VERSION DE PAPER, la plus ANCIENNE des deux qui
# tournent ici — celle que Paper embarque date de 2024, celle du proxy de 2026.
# Compiler contre la récente ferait un jar qui échoue sur le lobby avec un
# NoClassDefFoundError, ce qui est exactement arrivé. Les deux méthodes que seule
# la récente possède sont appelées par réflexion, et publiées seulement là où
# elles existent. spark-api est un instantané daté : l'horodatage est la version.
[versions]
paper-api = "1.21.11-R0.1-20260511.115010-91"
adventure = "4.26.1"
velocity-api = "3.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
examination-api = { module = "net.kyori:examination-api", version = "1.3.0" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }
checker-qual = { module = "org.checkerframework:checker-qual", version = "3.49.2" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "24.1.0" }
guava = { module = "com.google.guava:guava", version = "33.3.1-jre" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
spark-api = { module = "me.lucko:spark-api", version = "0.1-20240720.200737-2" }

[bundles]
paper = ["paper-api", "adventure-api", "adventure-key", "examination-api", "jspecify", "checker-qual", "jetbrains-annotations", "guava"]
